<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">

        <!-- BRAND LOGO: Kept on the left -->
        <a class="navbar-brand fw-bold" href="{% url 'market_dashboard' %}">
            <i class="bi bi-graph-up-arrow me-2 text-success"></i>Mock Exchange
        </a>

        <!-- MOBILE HAMBURGER BUTTON -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#responsiveNavbarMain" aria-controls="responsiveNavbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- THE COLLAPSIBLE CORES WRAPPER -->
        <div class="collapse navbar-collapse" id="responsiveNavbarMain">

            <!-- CENTRAL LINKS: Locked back to true horizontal center via mx-auto -->
            <div class="navbar-nav mx-auto gap-lg-3 my-2 my-lg-0 text-center">
                <a class="nav-link text-white-50" href="{% url 'market_dashboard' %}">
                    <i class="bi bi-speedometer2 me-1"></i> Market Dashboard
                </a>
                <a class="nav-link active fw-bold text-white" href="{% url 'user_portfolio' %}">
                    <i class="bi bi-briefcase me-1"></i> My Portfolio
                </a>
            </div>

            <!-- RIGHT STATUS: Refactored into a premium dropdown component profile trigger -->
            <div class="d-flex justify-content-center justify-content-lg-end pt-2 pt-lg-0">
                <div class="dropdown">
                    <!-- Dropdown Trigger Button Button -->
                    <button class="btn btn-outline-light dropdown-toggle btn-sm px-3 fw-bold d-flex align-items-center gap-2"
                            type="button"
                            id="userProfileDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span>{{ request.user.username }}</span>
                    </button>

                    <!-- Dropdown Menu Box Container -->
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userProfileDropdown">
                        <li>
                            <h6 class="dropdown-header text-uppercase tracking-wider small">Trader Session</h6>
                        </li>
                        <li>
                            <a class="dropdown-item py-2 text-secondary small" href="{% url 'user_portfolio' %}">
                                <i class="bi bi-wallet2 me-2"></i>View Cash Portfolio
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li class="px-2">
                            <!-- Secure POST form hidden inside dropdown row block link style -->
                            <form action="{% url 'logout' %}" method="POST" class="m-0 p-0">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item rounded btn text-danger d-flex align-items-center gap-2 w-100 py-2">
                                    <i class="bi bi-box-arrow-right"></i>
                                    <strong>Sign Out Account</strong>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

        </div>

    </div>
</nav>
