{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link
            crossorigin="anonymous"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'stock_market/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Menu Products</title>
    <style>


    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <!-- 1. FIX: Changed container-fluid to container to bring margins in from the edge -->
    <div class="container">

        <!-- BRAND LOGO: Stays visible on the left on all device viewports -->
        <a class="navbar-brand fw-bold" href="{% url 'market_dashboard' %}">
            <i class="bi bi-graph-up-arrow me-2 text-success"></i>Mock Exchange
        </a>

        <!-- MOBILE HAMBURGER BUTTON: Appears automatically when screens become narrow -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#responsiveNavbarMain"
                aria-controls="responsiveNavbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- THE COLLAPSIBLE WRAPPER: Handles centering on desktop, and vertical stacking on mobile -->
        <div class="collapse navbar-collapse" id="responsiveNavbarMain">

            <!-- CENTRAL LINKS: Flex rules center these items on desktop screens -->
            <div class="navbar-nav mx-auto gap-lg-3 my-2 my-lg-0 text-center">
                <a class="nav-link text-white-50" href="{% url 'market_dashboard' %}">
                    <i class="bi bi-speedometer2 me-1"></i> Market Dashboard
                </a>
                <a class="nav-link active fw-bold text-white" href="{% url 'user_portfolio' %}">
                    <i class="bi bi-briefcase me-1"></i> My Portfolio
                </a>
            </div>

            <!-- RIGHT STATUS: Auto-aligns nicely on the right edge on desktop layouts -->
            <div class="navbar-text text-white-50 text-center text-lg-end pt-1 pb-2 pb-lg-1">
                Logged in as: <strong class="text-white">{{ request.user.username }}</strong>
            </div>

        </div>

    </div>
</nav>
{% block content %}
{% endblock content %}

<script
        crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>
<script src="{% static 'stock_market/js/main.js' %}"></script>
</body>
</html>
