{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link
            crossorigin="anonymous"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'stock_market/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Menu Products</title>
    <style>


    </style>
</head>
<body>
<div class="container-fluid bg-dark">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
        <a href="/"
           class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
            <svg class="bi me-2"
                 width="40"
                 height="32"
                 role="img"
                 aria-label="Bootstrap">
                <use xlink:href="#bootstrap"/>
            </svg>
        </a>
        <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
            <li>
                <a href="{% url 'market_dashboard' %}"
                   class="nav-link text-secondary">
                    <i class="bi bi-house-door d-block mx-auto mb-1 text-center"
                       style="font-size: 24px;"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="{% url 'market_dashboard' %}"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 d-block mx-auto mb-1 text-center"
                       style="font-size: 24px;"></i>
                    Dashboard
                </a>
            </li>
            <li>
                <a href="{% url 'market_dashboard' %}"
                   class="nav-link text-white">
                    <i class="bi bi-briefcase-fill d-block mx-auto mb-1 text-center"
                       style="font-size: 24px;"></i>
                    Portfolio
                </a>
            </li>
            <li>
                <a href="{% url 'market_dashboard' %}"
                   class="nav-link text-white">
                    <i class="bi bi-clock-history d-block mx-auto mb-1 text-center"
                       style="font-size: 24px;"></i>
                    Transactions
                </a>
            </li>
        </ul>
    </div>
</div>
{% block content %}
{% endblock content %}

<script
        crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>
<script src="{% static 'stock_market/js/main.js' %}"></script>
</body>
</html>
