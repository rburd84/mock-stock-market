[project]
name = "stock-market-app"
version = "0.1.0"
description = "A modern Python web project powered by uv"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "flask>=3.0.0",
    "httpx>=0.27.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
lint.select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
